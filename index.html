<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B827C">
<title>Uang Berdua</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Tata letak: buku kas. Angka rupiah rata kanan dengan angka tabular;
   dua warna profil (pa, pb) dipakai konsisten untuk "punya siapa". */
:root{
  --bg:#F1F3F8;--surface:#FFFFFF;--sunk:#E6EAF2;--ink:#131B33;--muted:#59637F;--line:#D5DBE8;--on:#FFFFFF;
  --c-nila:#2C48D0;--c-mawar:#C42F68;--c-toska:#0B827C;--c-jingga:#BF540C;--c-ungu:#7439BF;--c-daun:#2A7F38;
  --ok:#1C8048;--warn:#A85F00;--bad:#BA3127;
  --pa:var(--c-nila);--pb:var(--c-mawar);--acc:var(--pa);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1322;--surface:#171F35;--sunk:#222C47;--ink:#E9EDF7;--muted:#9BA6C1;--line:#2B3654;--on:#0D1322;
  --c-nila:#8497FF;--c-mawar:#FF7DAA;--c-toska:#3FCFC7;--c-jingga:#FF9A52;--c-ungu:#B994FF;--c-daun:#6FD17C;
  --ok:#5FD08F;--warn:#F0B04A;--bad:#FF8A7E;color-scheme:dark}}
:root[data-ca="nila"]{--pa:var(--c-nila)}:root[data-ca="mawar"]{--pa:var(--c-mawar)}:root[data-ca="toska"]{--pa:var(--c-toska)}
:root[data-ca="jingga"]{--pa:var(--c-jingga)}:root[data-ca="ungu"]{--pa:var(--c-ungu)}:root[data-ca="daun"]{--pa:var(--c-daun)}
:root[data-cb="nila"]{--pb:var(--c-nila)}:root[data-cb="mawar"]{--pb:var(--c-mawar)}:root[data-cb="toska"]{--pb:var(--c-toska)}
:root[data-cb="jingga"]{--pb:var(--c-jingga)}:root[data-cb="ungu"]{--pb:var(--c-ungu)}:root[data-cb="daun"]{--pb:var(--c-daun)}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.15rem}h2{font-size:1.35rem}h3{font-size:1.05rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.va{--acc:var(--pa)}.vb{--acc:var(--pb)}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--ok)}.down{color:var(--bad)}

#app{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:14px 9rem;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand p{font-size:.82rem;color:var(--muted)}
.who{display:flex;background:var(--sunk);border-radius:99px;padding:3px;gap:2px;max-width:100%}
.who-b{border:0;background:none;border-radius:99px;padding:.45rem .85rem;display:flex;align-items:center;gap:.4rem;font-weight:500;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-b[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.sw{width:.6rem;height:.6rem;border-radius:50%;flex:none;display:inline-block}
.sw.a{background:var(--pa)}.sw.b{background:var(--pb)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--wall,none)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;background:var(--c);color:var(--on);font-family:var(--f-display);font-weight:700;line-height:1}
.avs{display:flex;flex:none}.avs .av{box-shadow:0 0 0 2px var(--surface)}.avs .av+.av{margin-left:-8px}
.filebtn{display:inline-flex;align-items:center;font-size:inherit;color:var(--ink);cursor:pointer}
.vh{position:absolute;opacity:0;width:1px;height:1px}
.walls button{border-radius:10px;width:3.2rem}
.goal-h{display:flex;gap:.7rem;align-items:center}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}.kv span:first-child{color:var(--muted)}
.bar.split{display:flex}.bar.split u{border-radius:0}.bar.split u.a{background:var(--pa)}.bar.split u.b{background:var(--pb)}
details.hist summary{cursor:pointer;color:var(--muted);font-size:.88rem;padding:.2rem 0}
.mv{display:grid;grid-template-columns:minmax(0,1fr) auto 2.4rem;gap:.5rem;align-items:center;padding:.3rem 0;border-top:1px solid var(--line);font-size:.9rem}
.mv small{display:block;color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.st{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:.15rem .55rem;border-radius:99px;color:var(--on);background:var(--c);white-space:nowrap}
.stackbar{display:flex;height:12px;border-radius:8px;overflow:hidden;gap:2px}.stackbar i{background:var(--k)}
.al{display:grid;grid-template-columns:.7rem minmax(0,1fr) auto;gap:2px .6rem;align-items:center;padding:.45rem 0;border-top:1px solid var(--line)}
.al i{width:.7rem;height:.7rem;border-radius:3px;background:var(--k)}.al small{grid-column:2/-1;color:var(--muted);font-size:.8rem}
.ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.ln.f{stroke:var(--acc)}.ln.p{stroke:var(--warn);stroke-dasharray:6 5}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted);margin-top:6px}
.legend span{display:flex;align-items:center;gap:.4rem}
.legend i{width:16px;height:3px;border-radius:3px;background:var(--c)}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
details.asm summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
details.asm[open] summary{margin-bottom:12px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.4rem .1rem;border-radius:10px;color:var(--muted);font-size:.72rem;font-weight:500}
.nav button[aria-current="page"]{color:var(--acc)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#view{display:flex;flex-direction:column;gap:14px;min-width:0}
#fab{position:fixed;right:16px;bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:99px;background:var(--acc);color:var(--on);font-weight:600;padding:.8rem 1.2rem;box-shadow:0 6px 18px rgb(0 0 0 / .25)}

@media (min-width:900px){
  #app{display:grid;grid-template-columns:190px minmax(0,1fr);grid-template-areas:"nav top" "nav view";align-items:start;gap:18px 28px;padding-block:22px 6.5rem}
  .top{grid-area:top}#view{grid-area:view}
  .nav{grid-area:nav;position:sticky;top:22px;flex-direction:column;border:0;background:none;padding:0;gap:2px}
  .nav button{flex:none;flex-direction:row;gap:.7rem;padding:.6rem .8rem;font-size:.95rem;justify-content:flex-start}
  .nav button[aria-current="page"]{background:var(--surface);color:var(--ink)}
  .nav button[aria-current="page"] svg{color:var(--acc)}
  #fab{bottom:28px;right:28px}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card>h3{margin-bottom:10px}
.hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.notice{border-radius:10px;padding:.6rem .8rem;background:var(--sunk);font-size:.9rem;display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;justify-content:space-between}
.empty{padding:28px 4px;display:flex;flex-direction:column;gap:6px;max-width:34rem}
.stack{display:flex;flex-direction:column;gap:12px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.6rem .95rem;font-weight:500;min-height:2.6rem}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
input[type=text],input[type=password],input[type=date],select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.55rem .7rem;min-height:2.6rem;width:100%;min-width:0}
label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.send{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.ib{border:0;background:none;width:2.4rem;height:2.4rem;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:1.3rem;line-height:1}
.ib:hover{background:var(--sunk);color:var(--ink)}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav strong{font-family:var(--f-display);font-size:1.1rem}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:.5rem .7rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font:700 clamp(1rem,4.2vw,1.3rem) var(--f-display);font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.tile span{font-size:.82rem;color:var(--muted)}
.big{font:700 2rem var(--f-display);font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.bar{height:8px;border-radius:8px;background:var(--sunk);overflow:hidden}
.bar u{display:block;height:100%;border-radius:8px;background:var(--acc)}
.bar.over u{background:var(--bad)}.bar.near u{background:var(--warn)}
.chart{width:100%;height:auto;display:block}
.chart rect{fill:var(--acc);opacity:.55}.chart rect.t{opacity:1}.chart rect.z{fill:var(--sunk);opacity:1}
.ch-g{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}.ch-t{fill:var(--muted);font:11px var(--f-body)}

.cat{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:2px .7rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--line)}
.cat:first-of-type{border-top:0}
.cat .bar{grid-column:2/-1}.cat .bar u{background:var(--k)}
.cat small{grid-column:2/-1;color:var(--muted);font-size:.8rem}
.em{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;font-size:1.05rem;background:color-mix(in srgb,var(--k) 20%,var(--surface));flex:none}
.dayh{display:flex;justify-content:space-between;gap:8px;padding:.9rem 0 .3rem;font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.dayh:first-child{padding-top:0}
.tx{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:0 .7rem;align-items:center;padding:.55rem 0;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;border-radius:0}
.tx:hover{background:color-mix(in srgb,var(--sunk) 50%,transparent)}
.tx .nm{font-weight:500;overflow-wrap:anywhere}
.tx .meta{display:flex;flex-wrap:wrap;gap:.15rem .45rem;font-size:.8rem;color:var(--muted);align-items:center}
.tx .amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx .amt small{display:block;font-weight:400;color:var(--muted);font-size:.76rem}
.tag{font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding:.08rem .45rem;border-radius:99px;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sws button{width:2.4rem;height:2.4rem;border-radius:50%;border:3px solid var(--surface);background:var(--c);box-shadow:0 0 0 1px var(--line)}
.sws button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.bud{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}

dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:18px;width:min(100% - 24px,440px);max-height:calc(100% - 24px)}
dialog::backdrop{background:rgb(8 12 24 / .5)}
.form{display:flex;flex-direction:column;gap:12px}
#f-amt{font:700 1.6rem var(--f-display);font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8.4rem + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0 / .25)}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;overflow:auto}
.dots{display:flex;gap:14px;margin:4px 0}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}.dots i.on{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,4.4rem);gap:12px}
.pad button{height:4.4rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:600 1.5rem var(--f-display)}
.pad button:active{background:var(--sunk)}.pad .ghost{visibility:hidden}
.alink{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.88rem;padding:.4rem}
.ahd{display:flex;justify-content:space-between;gap:8px;padding:.2rem 0;font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.catin{font-weight:600;color:var(--ink);background:transparent;border-style:dashed}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app" class="va">
  <header class="top">
    <div class="brand"><span id="duo" class="avs"></span><div><h1>Uang Berdua</h1><p id="sub"></p></div></div>
    <div id="who" class="who" role="group" aria-label="Keuangan siapa yang ditampilkan"></div>
  </header>
  <nav id="nav" class="nav" aria-label="Halaman"></nav>
  <main id="view">
    <div class="empty"><h2>Memuat catatan…</h2><p class="muted">Pengeluaran kalian berdua akan muncul di sini.</p></div>
  </main>
</div>
<button id="fab" type="button" hidden>+ Catat</button>
<dialog id="dlg" aria-label="Catat transaksi"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="lock" role="dialog" aria-modal="true" aria-label="Kunci PIN" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="config.js"></script>

function normTx(x,id){if(!x||typeof x!=='object')return null;
  const type=x.type==='in'||x.type==='settle'?x.type:'out',amt=int(x.amt);
  if(!amt||!DATE.test(x.date)||(x.by!=='a'&&x.by!=='b'))return null;
  const set=type==='in'?INC:CAT;
  return{id,type,amt,date:x.date,by:x.by,ts:+x.ts||0,note:str(x.note,80).trim(),
    cat:type==='settle'?'':(set[x.cat]?x.cat:(type==='in'?'masuk':'lain')),
    split:type==='out'&&SPLIT[x.split]?x.split:'self'}}
function normMeta(d){const m={names:{},colors:{},budget:{},photos:{},catl:{a:{},b:{}},pins:{a:'',b:''}};d=d&&typeof d==='object'?d:{};
  ['a','b'].forEach(sl=>{m.names[sl]=str(d.names&&d.names[sl],30).trim();
    for(const k in CAT){const t=str(d.catl&&d.catl[sl]&&d.catl[sl][k],40).trim();if(t)m.catl[sl][k]=t}
    const pn=d.pins&&d.pins[sl];m.pins[sl]=typeof pn==='string'&&/^[0-9a-f]{64}$/.test(pn)?pn:'';
    const c=d.colors&&d.colors[sl];m.colors[sl]=COLORS[c]?c:(sl==='a'?'nila':'mawar');
    const b=d.budget&&d.budget[sl]||{},cats={};for(const k in CAT){const v=int(b.cats&&b.cats[k]);if(v)cats[k]=v}
    m.budget[sl]={total:int(b.total),cats};
    const ph=d.photos&&d.photos[sl];if(typeof ph==='string'&&ph.length<90000&&PHOTO.test(ph))m.photos[sl]=ph});
  return m}
function normGoal(x,id){if(!x||typeof x!=='object')return null;const name=str(x.name,40).trim();if(!name)return null;
  const moves=(Array.isArray(x.moves)?x.moves:[]).map(m=>{if(!m||typeof m!=='object')return null;const amt=Math.trunc(+m.amt)||0;
    return amt&&Math.abs(amt)<=MAXAMT&&DATE.test(m.d)&&(m.by==='a'||m.by==='b')&&str(m.id,16)?{id:str(m.id,16),d:m.d,by:m.by,amt,note:str(m.note,60)}:null}).filter(Boolean).slice(-400);
  const valAt=DATE.test(x.valAt)?x.valAt:'';
  return{id,name,kind:KIND[x.kind]?x.kind:'tabung',owner:x.owner==='a'||x.owner==='b'?x.owner:'both',target:int(x.target),due:DATE.test(x.due)?x.due:'',
    value:valAt?int(x.value):0,valAt,ts:+x.ts||0,moves}}

const pf=(v,max,def)=>{v=typeof v==='string'?parseFloat(v.replace(',','.')):+v;return isFinite(v)&&v>=0?Math.min(max,v):def};
const pctS=v=>String(Math.round(v*10)/10).replace('.',',')+'%';
function normPlan(x,id){if(!x||typeof x!=='object')return null;const asset=ASSET[x.asset]?x.asset:'lain',A=ASSET[asset],ret={};
  for(const k in INS)ret[k]=pf(x.ret&&x.ret[k],50,INS[k][1]);
  return{id,asset,name:str(x.name,40).trim()||A[0],price:int(x.price),years:Math.min(50,Math.max(1,x.years|0)),start:int(x.start),monthly:int(x.monthly),
    raise:pf(x.raise,50,0),risk:RISK[x.risk]?x.risk:'mod',infl:pf(x.infl,50,A[2]),ret,cost:[0,1,2].map(i=>pf(x.cost&&x.cost[i],20,A[3][i])),
    by:x.by==='b'?'b':'a',ts:+x.ts||0}}
function newPlan(asset){const A=ASSET[asset],ret={};for(const k in INS)ret[k]=INS[k][1];
  return{id:null,asset,name:'',price:0,years:10,start:0,monthly:0,raise:5,risk:'mod',infl:A[2],ret,cost:A[3].slice(),by:S.me,ts:0}}
/* Proyeksi per tahun: harga aset naik mengikuti inflasi, dana tumbuh dengan return portofolio (bunga majemuk bulanan),
   dan setoran bulanan naik sekali setahun mengikuti kenaikan gaji. u = hasil akhir dari setoran Rp1/bulan, untuk mencari setoran yang dibutuhkan. */
function calcPlan(p){const al=RISK[p.risk][1],r=sum(Object.keys(INS).map(k=>al[k]*p.ret[k]))/10000,rm=Math.pow(1+r,1/12)-1,n=p.years;
  const price=[p.price],fund=[p.start];let f=p.start,u=0;
  for(let y=0;y<n;y++){const c=Math.pow(1+p.raise/100,y);for(let m=0;m<12;m++){f=f*(1+rm)+p.monthly*c;u=u*(1+rm)+c}
    fund.push(f);price.push(p.price*Math.pow(1+p.infl/100,y+1))}
  const fv=price[n],need=Math.max(0,(fv-(f-p.monthly*u))/u),ratio=fv?f/fv:0;
  return{al,r,price,fund,fv,end:f,need,ratio,gap:fv-f,hit:fund.findIndex((v,i)=>i>0&&v>=price[i]),
    status:ratio>=1.1?'lebih':ratio>=1?'cukup':'kurang',costs:p.cost.map(c=>fv*c/100)}}

function share(t,sl){if(t.type!=='out')return 0;const half=Math.floor(t.amt/2);

function readImg(file,max,square,q){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;
  r.onload=()=>{const im=new Image();im.onerror=rej;
    im.onload=()=>{let w=im.naturalWidth,ht=im.naturalHeight,sx=0,sy=0;
      if(square){const m=Math.min(w,ht);sx=(w-m)/2;sy=(ht-m)/2;w=ht=m}
      const k=Math.min(1,max/Math.max(w,ht)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(ht*k);
      c.getContext('2d').drawImage(im,sx,sy,w,ht,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};
    im.src=r.result};
  r.readAsDataURL(file)})}

function writeFail(e){const code=e&&e.code;

const wallKey=()=>lsGet('ub-wall')||'none';
function applyWall(){const k=wallKey(),R=document.documentElement;let v='';
  if(k==='photo'){const d=lsGet('ub-wall-img')||'';
    if(PHOTO.test(d)){const sc='color-mix(in srgb,var(--bg) 68%,transparent)';v='linear-gradient('+sc+','+sc+'),url("'+d+'") center/cover no-repeat'}}

function subscribe(){const db=S.db,col=db.collection('tx'),cut=addM(today().slice(0,7),-12)+'-01';
  const map=qs=>{const m={};qs.docs.forEach(d=>{const x=normTx(d.data(),d.id);if(x)m[x.id]=x});return m};
  const merge=()=>{S.tx=Object.values(Object.assign({},S.q2,S.q1)).sort((x,y)=>y.date.localeCompare(x.date)||y.ts-x.ts);changed()};
  /* 13 bulan terakhir untuk ringkasan, ditambah semua transaksi bersama supaya saldo utang selalu utuh */
  col.where('date','>=',cut).onSnapshot(qs=>{S.q1=map(qs);S.ready=true;merge()},subErr);
  col.where('sh','==',true).onSnapshot(qs=>{S.q2=map(qs);merge()},subErr);
  /* Snapshot kosong dari cache belum boleh dianggap "tanpa PIN"; tunggu data dari server */
  db.doc('uang/meta').onSnapshot(sn=>{S.meta=normMeta(sn.exists?sn.data():null);
    if(sn.exists||!sn.metadata.fromCache){S.metaLoaded=true;['a','b'].forEach(sl=>lsSet('ub-pin-'+sl,S.meta.pins[sl]||'0'))}
    changed()},subErr);
  db.collection('assets').onSnapshot(qs=>{S.assets=qs.docs.map(d=>normAsset(d.data(),d.id)).filter(Boolean).sort((x,y)=>x.ts-y.ts||x.name.localeCompare(y.name));changed()},subErr);
  /* Nama dari Jadwal Berdua dipakai kalau ruangnya sama dan nama di sini belum diisi */
  ['a','b'].forEach(sl=>db.doc('profiles/'+sl).get().then(sn=>{if(!sn.exists)return;const p=sn.data()||{};S.jn[sl]=str(p.name,30).trim();
    if(typeof p.photo==='string'&&p.photo.length<90000&&PHOTO.test(p.photo))S.jp[sl]=p.photo;changed()}).catch(()=>{}));
  db.collection('goals').onSnapshot(qs=>{S.goals=qs.docs.map(d=>normGoal(d.data(),d.id)).filter(Boolean).sort((x,y)=>x.ts-y.ts);changed()},subErr);
  db.collection('plans').onSnapshot(qs=>{S.plans=qs.docs.map(d=>normPlan(d.data(),d.id)).filter(Boolean).sort((x,y)=>x.ts-y.ts);changed()},subErr);
  db.doc('uang/wall').onSnapshot(sn=>{const w=sn.exists?sn.data()||{}:{key:'none'};
    if(w.key==='photo'?PHOTO.test(w.img||''):!!WALLS[w.key]){storeWall(w);changed()}},subErr)}

function connect(){if(!S.fs||!S.room||S.db){render();return}
  const pre='rooms/'+S.room+'/';S.db={doc:p=>S.fs.doc(pre+p),collection:p=>S.fs.collection(pre+p)};

function planChart(c,p){const n=p.years,W=chartW(),H=230,top=14,bot=22,max=Math.max(c.fv,c.end,1),y0=new Date().getFullYear();
  const X=i=>6+i/n*(W-12),Y=v=>H-bot-v/max*(H-top-bot),pts=a=>a.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const g=s('svg',{class:'chart',viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'Proyeksi harga aset dan dana investasi dari '+y0+' sampai '+(y0+n)+'. Harga akhir '+rp(c.fv)+', dana akhir '+rp(c.end)+'.'});
  [0,.5,1].forEach(k=>{g.append(s('line',{class:'ch-g',x1:0,x2:W,y1:Y(max*k),y2:Y(max*k)}));if(k)g.append(s('text',{class:'ch-t',x:0,y:Y(max*k)-4},'Rp'+short(max*k)))});
  const step=Math.max(1,Math.ceil(n/6));
  for(let i=0;i<=n;i++)if(i===n||(i%step===0&&n-i>=step*.6))g.append(s('text',{class:'ch-t',x:X(i),y:H-5,'text-anchor':i===0?'start':i===n?'end':'middle'},y0+i));
  g.append(s('polyline',{class:'ln p',points:pts(c.price)}),s('polyline',{class:'ln f',points:pts(c.fund)}));
  c.fund.forEach((v,i)=>{if(i)g.append(s('circle',{cx:X(i),cy:Y(v),r:7,fill:'transparent'},s('title',null,(y0+i)+': dana '+rp(v)+', harga '+rp(c.price[i]))))});
  return g}

function exportCsv(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[['tanggal','jenis','jumlah','kategori','catatan','dibayar_oleh','untuk']];

    t.type==='out'?(t.split==='both'?'berdua':t.split==='other'?pname(other(t.by)):pname(t.by)):'']));
  S.goals.forEach(g=>g.moves.forEach(m=>rows.push([m.d,m.amt<0?'tarik tabungan':'setor tabungan',Math.abs(m.amt),g.name,m.note,pname(m.by),g.owner==='both'?'berdua':pname(g.owner)])));

  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}

  const sel=(id,set,def)=>h('select',{id},Object.keys(set).map(k=>{const c=set===CAT?cl(k,S.me):set[k];return h('option',{value:k,selected:k===(set[e.cat]?e.cat:def)},c[1]+' '+c[0])}));
  const fOut=field('Kategori','f-cat-out',sel('f-cat-out',CAT,'makan')),fIn=field('Kategori','f-cat-in',sel('f-cat-in',INC,'saku'));
  const fSplit=field('Untuk siapa','f-split',h('select',{id:'f-split'},Object.keys(SPLIT).map(k=>h('option',{value:k,selected:k===e.split},SPLIT[k]))));
  const seg=h('div',{class:'seg',role:'group','aria-label':'Jenis'},[['out','Pengeluaran'],['in','Pemasukan']].map(([k,l])=>h('button',{type:'button','data-k':k,onclick:()=>{type=k;sync()}},l)));
  const sync=()=>{seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===type)));fOut.hidden=fSplit.hidden=type!=='out';fIn.hidden=type!=='in'};
  sync();
  show(t?'Ubah transaksi':'Catat transaksi',[seg,field('Jumlah (Rp)','f-amt',moneyIn('f-amt',e.amt)),fOut,fIn,
    h('div',{class:'two'},dateIn(e.date),field('Dibayar / diterima oleh','f-by',whoSel('f-by',e.by))),fSplit,noteIn(e.note,'mis. nasi padang, bensin',80)],t,
    ()=>{const split=type==='out'?$('f-split').value:'self';return{type,by:$('f-by').value,cat:$(type==='out'?'f-cat-out':'f-cat-in').value,split,sh:split!=='self'}})}
function openSettle(t){const D=debtLine(),e=t||{amt:D?D.amt:0,date:today(),by:D?D.deb:S.me,note:''};
  show(t?'Ubah pelunasan':'Catat pelunasan',[h('p',{class:'muted',text:'Dipakai saat salah satu mentransfer atau memberi uang untuk melunasi utang ke pasangannya.'}),
    field('Yang membayar','f-by',whoSel('f-by',e.by)),field('Jumlah (Rp)','f-amt',moneyIn('f-amt',e.amt)),
    dateIn(e.date),noteIn(e.note,'mis. transfer BCA',80)],t,
    ()=>({type:'settle',by:$('f-by').value,cat:'',split:'self',sh:true}))}

function openGoal(g){const e=g||{name:'',kind:'tabung',owner:S.me,target:0,due:''};
  dlgForm(g?'Ubah tujuan':'Tujuan menabung baru',[
    field('Nama tujuan','g-name',h('input',{type:'text',id:'g-name',maxlength:40,value:e.name,placeholder:'mis. Dana darurat, Liburan Bali',autocomplete:'off',required:true})),
    h('div',{class:'two'},field('Jenis','g-kind',h('select',{id:'g-kind'},Object.keys(KIND).map(k=>h('option',{value:k,selected:k===e.kind},KIND[k][1]+' '+KIND[k][0])))),
      field('Milik','g-owner',h('select',{id:'g-owner'},[[S.me,'Saya'],[other(S.me),pname(other(S.me))],['both','Berdua']].map(o=>h('option',{value:o[0],selected:o[0]===e.owner},o[1]))))),
    h('div',{class:'two'},field('Target (Rp, boleh kosong)','g-target',moneyIn('g-target',e.target)),
      field('Tenggat (boleh kosong)','g-due',h('input',{type:'date',id:'g-due',value:e.due})))],
    ()=>{const name=$('g-name').value.trim().slice(0,40);if(!name){toast('Isi nama tujuannya dulu.');return false}
      const d={name,kind:$('g-kind').value,owner:$('g-owner').value,target:digits($('g-target').value),due:DATE.test($('g-due').value)?$('g-due').value:''};
      if(g)goalRef(g.id).update(d).catch(writeFail);else goalRef().set(Object.assign({ts:Date.now(),moves:[]},d)).catch(writeFail);

  if(!g)$('g-name').focus()}
function openMove(g,sign){const net=gStat(g).net;
  dlgForm((sign>0?'Setor ke ':'Tarik dari ')+g.name,[field('Jumlah (Rp)','f-amt',moneyIn('f-amt',0)),
    h('div',{class:'two'},dateIn(today()),field(sign>0?'Disetor oleh':'Ditarik oleh','f-by',whoSel('f-by',g.owner==='both'?S.me:g.owner))),noteIn('',sign>0?'mis. sisa uang saku':'mis. bayar tiket',60)],
    ()=>{const v=amtDate();if(!v)return false;
      if(sign<0&&v.amt>net){toast('Melebihi saldo setoran ('+rp(net)+').');return false}

  dlgForm('Nilai '+g.name+' sekarang',[h('p',{class:'muted',text:'Isi nilai total investasinya hari ini, seperti yang tertera di aplikasi sekuritas atau bank. Modal disetor: '+rp(x.net)+'.'}),

/* ---------- kunci PIN ---------- */
/* Yang disimpan hanya hash PIN (disamarkan dengan kode ruang dan profil), disinkronkan lewat meta supaya berlaku di semua perangkat.
   PIN 4 angka bukan enkripsi data: ia mencegah orang iseng yang memegang perangkat yang sedang terbuka. */
async function pinHash(sl,pin){const msg='ub1:'+S.room+':'+sl+':'+pin;
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}
  let out='';for(let r=0;r<8;r++){let a=0x811c9dc5^(r*2654435761);for(let i=0;i<msg.length;i++){a^=msg.charCodeAt(i);a=Math.imul(a,16777619)}out+=(a>>>0).toString(16).padStart(8,'0')}
  return out}
/* null = belum diketahui, '' = tanpa PIN, selain itu hash-nya */
function pinState(sl){if(S.metaLoaded)return S.meta.pins[sl]||'';const v=lsGet('ub-pin-'+sl);return v===null?null:v==='0'?'':v}
let lockBuf='',lockFails=0,lockUntil=0,lockMode='',lockBusy=false;
function lockDots(){const d=$('lock').querySelector('.dots');if(d)d.querySelectorAll('i').forEach((i,n)=>i.classList.toggle('on',n<lockBuf.length))}
function lockMsg(t){const m=$('lock').querySelector('.lmsg');if(m)m.textContent=t}
async function lockPress(k){if(lockBusy)return;
  if(k==='<'){lockBuf=lockBuf.slice(0,-1);lockDots();return}
  if(lockBuf.length>=4)return;
  if(Date.now()<lockUntil){lockMsg('Terlalu banyak percobaan. Tunggu '+Math.ceil((lockUntil-Date.now())/1000)+' detik.');return}
  lockBuf+=k;lockDots();lockMsg('');if(lockBuf.length<4)return;
  lockBusy=true;const h1=await pinHash(S.me,lockBuf);lockBusy=false;lockBuf='';
  if(h1===pinState(S.me)){lockFails=0;S.unlocked=true;render();return}
  lockDots();if(++lockFails>=5){lockFails=0;lockUntil=Date.now()+30000;lockMsg('PIN salah 5 kali. Coba lagi dalam 30 detik.')}else lockMsg('PIN salah.')}
function buildLock(el){const me=S.me;lockBuf='';
  const forgot=h('form',{class:'stack',hidden:true,style:'width:min(100%,320px)',onsubmit:e=>{e.preventDefault();
      const v=$('lk-room').value.trim().replace(/^.*#r-/,'');
      if(v!==S.room){lockMsg('Kode ruang tidak cocok.');return}
      if(!S.db){lockMsg('Belum tersambung. Coba lagi sebentar.');return}
      saveMeta({pins:{[me]:''}});lsSet('ub-pin-'+me,'0');S.meta.pins[me]='';S.unlocked=true;render();toast('PIN dihapus. Atur PIN baru di menu Atur.')}},
    h('p',{class:'muted',style:'font-size:.88rem',text:'Tempel tautan atau kode ruang (dari menu Atur di perangkat lain, atau dari pasanganmu) untuk menghapus PIN.'}),
    h('input',{type:'text',id:'lk-room',placeholder:'Tautan atau kode ruang','aria-label':'Tautan atau kode ruang',autocomplete:'off'}),h('button',{class:'btn pri',type:'submit'},'Hapus PIN'));
  const pad=h('div',{class:'pad'},['1','2','3','4','5','6','7','8','9'].map(k=>h('button',{type:'button',onclick:()=>lockPress(k)},k)),
    h('button',{type:'button',class:'ghost',tabindex:'-1','aria-hidden':'true'}),h('button',{type:'button',onclick:()=>lockPress('0')},'0'),
    h('button',{type:'button','aria-label':'Hapus angka',onclick:()=>lockPress('<')},'⌫'));
  el.replaceChildren(avatar(me,56),h('h2',{text:'Masukkan PIN'}),h('p',{class:'muted',text:'Profil '+pname(me)}),
    h('div',{class:'dots','aria-hidden':'true'},[0,1,2,3].map(()=>h('i'))),h('p',{class:'lmsg down','aria-live':'polite',style:'min-height:1.4em'}),pad,
    h('button',{type:'button',class:'alink',onclick:()=>{forgot.hidden=!forgot.hidden;pad.hidden=!forgot.hidden}},'Lupa PIN?'),forgot)}
function updateLock(){const el=$('lock'),st=S.me?pinState(S.me):'',need=!!S.me&&!S.unlocked&&st!=='';
  if(!need){el.hidden=true;lockMode='';return}
  el.hidden=false;
  const mode=st===null?'wait':S.me;
  if(mode===lockMode)return;lockMode=mode;
  if(st===null)el.replaceChildren(h('h2',{text:'Memuat…'}),h('p',{class:'muted',text:'Memeriksa pengaturan PIN.'}));else buildLock(el)}
document.addEventListener('keydown',e=>{if($('lock').hidden||lockMode==='wait'||e.ctrlKey||e.metaKey||e.altKey)return;
  const f=$('lk-room');if(f&&document.activeElement===f)return;
  if(/^\d$/.test(e.key))lockPress(e.key);else if(e.key==='Backspace')lockPress('<')});
function openPin(){const me=S.me,has=!!S.meta.pins[me];
  const pin=(id,label)=>field(label,id,h('input',{type:'password',id,inputmode:'numeric',maxlength:4,autocomplete:'off',oninput:e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)}}));
  const d=$('dlg');
  const run=async(remove)=>{const cur=has?$('p-cur').value:'',nw=remove?'':$('p-new').value;
    if(has&&await pinHash(me,cur)!==S.meta.pins[me]){toast('PIN saat ini salah.');return}
    if(!remove){if(!/^\d{4}$/.test(nw)){toast('PIN baru harus 4 angka.');return}
      if(nw!==$('p-new2').value){toast('Konfirmasi PIN tidak sama.');return}}
    const hh=remove?'':await pinHash(me,nw);saveMeta({pins:{[me]:hh}});lsSet('ub-pin-'+me,hh||'0');S.meta.pins[me]=hh;S.unlocked=true;
    d.close();render();toast(remove?'PIN dimatikan.':'PIN disimpan.')};
  dlgForm(has?'Ubah PIN':'Atur PIN',[h('p',{class:'muted',text:'PIN 4 angka untuk profil '+pname(me)+'. PIN diminta setiap kali halaman dibuka.'}),
    has&&pin('p-cur','PIN saat ini'),pin('p-new','PIN baru (4 angka)'),pin('p-new2','Ulangi PIN baru')],()=>{run(false);return false},
    has&&h('button',{class:'btn danger',type:'button',onclick:()=>run(true)},'Matikan PIN'));
  $(has?'p-cur':'p-new').focus()}

/* ---------- render ---------- */
let chT;function changed(){clearTimeout(chT);chT=setTimeout(render,40)}
function render(){updateLock();const g=gate(),root=document.documentElement,perPerson=S.tab==='ringkas'||S.tab==='transaksi';
  root.dataset.ca=S.meta.colors.a||'nila';root.dataset.cb=S.meta.colors.b||'mawar';
  $('app').className=(perPerson?S.view:S.me)==='b'?'vb':'va';$('fab').className=S.me==='b'?'vb':'va';
  $('fab').hidden=!!g;$('nav').hidden=!!g;$('who').hidden=!!g||!perPerson;
  $('sub').textContent=g?'Catatan pengeluaran untuk berdua':perPerson?(S.view===S.me?'Keuanganmu':'Keuangan '+pname(S.view)):S.tab==='berdua'?'Kalian berdua':S.tab==='tabungan'?'Tabungan & investasi':'Pengaturan';
  $('duo').replaceChildren(...(g?[]:[avatar('a',34),avatar('b',34)]));
  if(g){$('view').replaceChildren(...g);return}
  $('who').replaceChildren(...[S.me,other(S.me)].map(sl=>h('button',{class:'who-b',type:'button','aria-pressed':String(S.view===sl),onclick:()=>{S.view=sl;S.fcat='';render()}},avatar(sl,22),sl===S.me?'Saya':pname(sl))));
  $('nav').replaceChildren(...TABS.map(([k,l,p])=>h('button',{type:'button','aria-current':S.tab===k?'page':null,onclick:()=>{S.tab=k;render();scrollTo(0,0)}},icon(p),l)));
  /* Jangan timpa formulir Atur saat pengguna sedang mengetik di dalamnya */
  const ae=document.activeElement;if((S.tab==='atur'||(S.tab==='tabungan'&&S.draft))&&ae&&ae.tagName==='INPUT'&&ae.type==='text'&&$('view').contains(ae)&&!ae.readOnly)return;
  if(!S.ready){$('view').replaceChildren(empty('Memuat catatan…','Sebentar, sedang mengambil data dari penyimpanan bersama.'));return}
  $('view').replaceChildren(...({ringkas:vRingkas,transaksi:vTransaksi,tabungan:vTabungan,berdua:vBerdua,atur:vAtur})[S.tab]())}

$('fab').addEventListener('click',()=>openTx(null));
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
})();
